# ZAP core version, resolved from Maven Central. Must match the version the add-ons in addons/
# were built against, otherwise their supertypes fail to resolve and those types are skipped.
zapVersion=2.17.0

# Patched java2typescript build, installed into the local Maven repository with:
#   mvn -pl core,processor -am install
java2tsVersion=2.0-20241009

# Where the add-on .zap files are read from, relative to this project.
addOnsDir=addons

# Checkout to copy .zap files from, used by the syncAddOns task.
zapExtensionsDir=../zap-extensions

# Binary name prefixes to declare. Everything else found while scanning (bundled third-party code
# such as net.bytebuddy or com.fasterxml, which .zap files ship inside them) stays on the classpath
# for supertype resolution but is not emitted.
declaredPackages=org.zaproxy.,org.parosproxy.,org.apache.commons.httpclient.,ch.csnc.

org.gradle.caching=true
